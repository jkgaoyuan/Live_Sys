# SRS 5 配置：直播在线流（HTTP-FLV/HLS/WebRTC）+ 服务端自动 DVR 录制 + WHIP 推流
# 部署方式见 docker-compose.yml；媒体目录与后端 bind mount 共享。
# @see https://ossrs.net/lts/zh-cn/docs/v5/doc/dvr

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# WebRTC 服务（WHIP 推流 / WHEP 拉流）
rtc_server {
    enabled         on;
    listen          8000;
    # 浏览器 ICE 连接地址：单机验证用 127.0.0.1，跨机部署改宿主机局域网 IP
    candidate       $SRS_CANDIDATE;
}

vhost __defaultVhost__ {
    # 直播中切片（学生端 hls.js 拉流）
    hls {
        enabled         on;
        hls_fragment    4;
        hls_window      30;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # HTTP-FLV 低延迟拉流（学生端 flv.js）
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # 服务端自动录制：每场直播一个 mp4，断流即定稿并触发 on_dvr 回调
    dvr {
        enabled         on;
        dvr_apply       all;
        dvr_plan        session;
        dvr_path        ./objs/nginx/html/dvr/[app]/[stream].[2006][01][02][15][04][05].mp4;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
    }

    # 不使用 http_hooks：录制定稿由后端查询 SRS HTTP API 自行检测，
    # 这样后端只需监听 127.0.0.1，不必为容器回调暴露到局域网。
}
